name: Calendar Event Reminders

on:
  schedule:
    # Every 10 minutes, at minutes ending in 4 (never :00 or :30). GitHub
    # documents the start of every hour as a high-load time when scheduled
    # runs get delayed or dropped, and on 2026-10-14 a */30 schedule got
    # only 4 runs in ~14 hours. More attempts, away from the busy marks,
    # raise the odds that one lands inside each reminder window. The
    # repo is public, so the extra runs cost nothing.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the "already reminded" state file back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dateutil tzdata

      - name: Run calendar reminders script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python calendar_reminders.py

      - name: Save "reminded events" state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f reminded_events.json ]; then
            git add reminded_events.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update reminded_events.json"
            git push
          else
            echo "No change to reminded_events.json — nothing to commit."
          fi
