name: Weekly Market Prep Report

on:
  schedule:
    # Runs every Sunday at 15:00 UTC — ahead of the forex market reopening
    # (~22:00 UTC Sunday) and while you're doing your usual weekend prep.
    - cron: '0 15 * * 0'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the published .ics calendar file
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dateutil tzdata

      - name: Run weekly market prep script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python weekly_market_prep.py

      - name: Publish updated .ics calendar file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/economic_calendar.ics
          if ! git diff --cached --quiet; then
            git commit -m "Update economic_calendar.ics"
            git push
          else
            echo "No change to economic_calendar.ics — nothing to commit."
          fi
