name: Monthly Top Gainers Report

on:
  schedule:
    # Runs on the 2nd of every month at 12:00 UTC — reports the trailing
    # 3 months of price performance, updated monthly.
    - cron: '0 12 2 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ~31-ticker watchlist takes a few minutes; this is a safety cap with margin for retries
    permissions:
      contents: write   # needed to commit top10_companies.json back for company_deepdive.py
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Run monthly top gainers script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python monthly_top_gainers.py

      - name: Save top10_companies.json back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only present if the run actually produced a non-empty top-10
          # list (e.g. absent if Twelve Data failed entirely this run) —
          # git add on a missing file would fail the whole step.
          if [ -f top10_companies.json ]; then
            git add top10_companies.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update top10_companies.json"
            git push
          else
            echo "No change to top10_companies.json — nothing to commit."
          fi
