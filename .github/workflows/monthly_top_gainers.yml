name: Monthly Top Gainers Report

on:
  schedule:
    # Runs on the 2nd of every month at 12:00 UTC — reports the trailing
    # 3 months of price performance, updated monthly.
    - cron: '0 12 2 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # the full S&P 500 pull takes ~1 hour by design; this is a safety cap
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Run monthly top gainers script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python monthly_top_gainers.py
