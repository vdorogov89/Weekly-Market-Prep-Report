name: Morgan Stanley Podcast Digest

on:
  schedule:
    # Runs once a day at 18:00 UTC (~2pm US Eastern) — episodes on this
    # page have historically published sometime between ~9am and ~2pm
    # Eastern, so checking at 08:00 UTC (~4am Eastern) was consistently
    # a day behind. 18:00 UTC gives same-day episodes time to appear.
    - cron: '0 18 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the "seen episodes" state file back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Morgan Stanley podcast digest script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ms_insights_digest.py

      - name: Save "seen episodes" state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_podcasts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen_podcasts.json"
            git push
          else
            echo "No change to seen_podcasts.json — nothing to commit."
          fi
