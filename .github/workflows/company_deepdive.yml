name: Company Deep Dive

on:
  schedule:
    # Runs once a day at 09:00 UTC. Most days of the month this does
    # nothing (only the 10 days following the monthly top-10 report are
    # "due" — see company_deepdive.py), which is expected, not an error.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      test_rank:
        description: 'Testing: rank to generate right now (1-10). Leave empty for the normal daily run.'
        required: false
        type: string

jobs:
  send-deepdive:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the "already sent" state file back
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run company deep-dive script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_RANK: ${{ github.event.inputs.test_rank }}
        run: python company_deepdive.py

      - name: Save "already sent" state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The file may not exist yet — a test run (TEST_RANK set) never
          # touches it, and a normal run that found nothing due today
          # returns before creating it either. `git add` on a missing
          # file would fail the whole step, so only add it if present.
          if [ -f deepdive_sent_state.json ]; then
            git add deepdive_sent_state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update deepdive_sent_state.json"
            git push
          else
            echo "No change to deepdive_sent_state.json — nothing to commit."
          fi
